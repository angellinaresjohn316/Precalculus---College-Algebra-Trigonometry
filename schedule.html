<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schedule">
<title>Schedule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');
:root{
  --moss:#4a7c3f;--leaf:#6fa651;--canopy:#a8d08d;--soil:#111409;--paper:#f0ebe0;
  --run:#5b9bd5;--speed:#e0a23b;--rest:#8a8f82;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--soil);color:var(--paper);font-family:'DM Mono',monospace;min-height:100dvh;overflow-x:hidden;}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% -10%,#1e3d18 0%,#0a1208 55%,var(--soil) 100%);}
.tree{position:absolute;bottom:0;background:#080c06;}
.t1{left:-3%;width:20%;height:46%;clip-path:polygon(50% 0%,12% 42%,24% 42%,4% 68%,20% 68%,0% 100%,100% 100%,80% 68%,96% 68%,76% 42%,88% 42%);}
.t2{right:-4%;width:24%;height:54%;clip-path:polygon(50% 0%,15% 40%,26% 40%,6% 66%,21% 66%,0% 100%,100% 100%,79% 66%,94% 66%,74% 40%,85% 40%);}
.page{position:relative;z-index:10;min-height:100dvh;display:flex;flex-direction:column;padding:0 18px max(28px,env(safe-area-inset-bottom));}
.header{padding-top:max(50px,calc(env(safe-area-inset-top) + 22px));text-align:center;animation:fadeDown .6s ease both;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--canopy);opacity:.6;margin-bottom:5px;}
.title{font-family:'DM Serif Display',serif;font-size:clamp(30px,8vw,42px);line-height:1.05;}
.title em{color:var(--canopy);font-style:italic;}
.nav{display:flex;gap:8px;margin:16px 0 0;animation:fadeDown .6s .05s ease both;}
.nav a{flex:1;text-align:center;padding:9px;border:1px solid rgba(168,208,141,.15);border-radius:10px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--canopy);text-decoration:none;transition:all .2s;}
.nav a.active{background:rgba(74,124,63,.2);border-color:rgba(168,208,141,.35);}
.nav a:active{transform:scale(.97);}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* TODAY */
.today{margin:16px 0 0;border-radius:16px;padding:15px 16px;animation:fadeUp .6s .1s ease both;}
.today.key{background:linear-gradient(135deg,rgba(224,162,59,.22),rgba(10,18,8,.2));border:1px solid rgba(224,162,59,.4);}
.today.normal{background:linear-gradient(135deg,rgba(45,90,39,.3),rgba(10,18,8,.2));border:1px solid rgba(111,166,81,.25);}
.today.rest{background:rgba(255,255,255,.03);border:1px solid rgba(168,208,141,.12);}
.t-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.t-day{font-family:'DM Serif Display',serif;font-size:21px;}
.t-date{font-size:10px;color:var(--canopy);opacity:.5;}
.t-focus{font-size:13px;color:var(--canopy);margin-top:8px;font-weight:500;}
.t-sub{font-size:10px;color:var(--paper);opacity:.5;line-height:1.4;margin-top:3px;}
.t-tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;}
.tag{font-size:9px;letter-spacing:1px;padding:5px 9px;border-radius:100px;border:1px solid rgba(168,208,141,.2);color:var(--canopy);}
.tag.on{background:rgba(74,124,63,.25);}
/* FRAME */
.frame{margin:11px 0 0;font-size:9.5px;letter-spacing:.5px;color:var(--canopy);opacity:.4;text-align:center;line-height:1.6;animation:fadeUp .6s .13s ease both;}
/* WEEK */
.label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--canopy);opacity:.45;margin:20px 0 9px;}
.week{display:flex;flex-direction:column;gap:6px;animation:fadeUp .6s .16s ease both;}
.row{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.025);border:1px solid rgba(168,208,141,.07);border-radius:12px;padding:11px 13px;}
.row.now{border-color:rgba(111,166,81,.4);background:rgba(45,90,39,.14);}
.row.spd{border-color:rgba(224,162,59,.3);}
.r-day{width:34px;flex-shrink:0;font-size:11px;letter-spacing:1px;color:var(--paper);opacity:.7;}
.row.now .r-day{color:var(--canopy);opacity:1;}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot.lower{background:var(--leaf);}.dot.upper{background:var(--leaf);}
.dot.run{background:var(--run);}.dot.speed{background:var(--speed);}
.dot.rest{background:var(--rest);}.dot.church{background:var(--canopy);opacity:.6;}
.r-text{flex:1;min-width:0;}
.r-focus{font-size:12px;color:var(--paper);}
.row.spd .r-focus{color:var(--speed);font-weight:500;}
.r-note{font-size:9px;color:var(--canopy);opacity:.42;line-height:1.3;margin-top:1px;}
.r-study{font-size:8px;letter-spacing:.5px;color:var(--canopy);opacity:.5;flex-shrink:0;border:1px solid rgba(168,208,141,.18);border-radius:6px;padding:3px 6px;}
/* COUNTDOWN */
.counts{display:flex;gap:8px;margin:18px 0 0;animation:fadeUp .6s .19s ease both;}
.count{flex:1;background:rgba(255,255,255,.025);border:1px solid rgba(168,208,141,.08);border-radius:12px;padding:12px 10px;text-align:center;}
.c-num{font-family:'DM Serif Display',serif;font-size:26px;color:var(--canopy);line-height:1;}
.c-label{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--paper);opacity:.45;margin-top:5px;line-height:1.3;}
.foot{text-align:center;font-size:9px;color:var(--canopy);opacity:.3;letter-spacing:1px;margin:16px 0 0;}
</style>
</head>
<body>
<div class="bg"><div class="tree t1"></div><div class="tree t2"></div></div>
<div class="page">
  <div class="header">
    <div class="eyebrow">Summer 2026 · Internship Block</div>
    <div class="title"><em>Weekly</em> Plan</div>
  </div>
  <nav class="nav">
    <a href="index.html">Session</a>
    <a href="schedule.html" class="active">Schedule</a>
  </nav>

  <div id="today" class="today normal"></div>
  <div class="frame" id="frame"></div>

  <div class="label">Training Week</div>
  <div class="week" id="week"></div>

  <div class="label">Countdown</div>
  <div class="counts" id="counts"></div>

  <div class="foot">Speed Saturdays. Easy weekdays. Sleep is the workout you skip last.</div>
</div>

<script>
// 0=Sun ... 6=Sat
const PLAN={
  1:{focus:'Lower Power + Accelerations',type:'lower',note:'Sprint mechanics + leg strength',study:1},
  2:{focus:'Easy Aerobic Run',type:'run',note:'25–30 min · XC base',study:1},
  3:{focus:'Upper + Core',type:'upper',note:'Pull · push · trunk',study:1},
  4:{focus:'Strides + Easy Run',type:'run',note:'20 min + 5 strides',study:1},
  5:{focus:'Rest / Mobility',type:'rest',note:'Recover for Saturday',study:0},
  6:{focus:'SPEED DAY',type:'speed',note:'The session — done fresh, full effort',study:1,key:1},
  0:{focus:'Church → Recovery',type:'church',note:'Rest, or a 20-min shakeout jog',study:1},
};
const ORDER=[1,2,3,4,5,6,0];
const SHORT={1:'Mon',2:'Tue',3:'Wed',4:'Thu',5:'Fri',6:'Sat',0:'Sun'};
const FULL={1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday',0:'Sunday'};

const now=new Date();
const dow=now.getDay();
const p=PLAN[dow];

// Today card
const t=document.getElementById('today');
t.className='today '+(p.key?'key':(p.type==='rest'?'rest':'normal'));
const studyLine = dow===6 ? 'Heavy study block — 2–3 videos' : (dow===0 ? 'Study PM — 1–2 videos' : (p.study?'Prof. Leonard tonight':'Light night — rest your head too'));
t.innerHTML=`
  <div class="t-top"><div class="t-day">${p.key?'🔑 ':''}${FULL[dow]}</div>
  <div class="t-date">${now.toLocaleDateString('en-US',{month:'long',day:'numeric'})}</div></div>
  <div class="t-focus">${p.focus}</div>
  <div class="t-sub">${p.note}</div>
  <div class="t-tags">
    <span class="tag ${p.type!=='rest'?'on':''}">🏃 ${p.type==='rest'?'Rest':'Train'}</span>
    <span class="tag ${p.study?'on':''}">📐 ${p.study?'Study':'Off'}</span>
  </div>`;

// Frame line (weekday vs weekend context)
const frame=document.getElementById('frame');
frame.innerHTML = (dow>=1&&dow<=5)
  ? 'Wake 4:20 · leave 5:00 · Onto 6:30–3:00 · home ~4:30 · session ~5:00 · sleep 9:00'
  : (dow===0 ? 'Church AM · recovery + study PM · prep for the week tonight'
             : 'Free morning — speed session fresh · big study block midday');

// Week
const week=document.getElementById('week');
week.innerHTML=ORDER.map(d=>{
  const x=PLAN[d];
  return `<div class="row ${d===dow?'now':''} ${x.key?'spd':''}">
    <div class="r-day">${SHORT[d]}</div>
    <div class="dot ${x.type}"></div>
    <div class="r-text">
      <div class="r-focus">${x.focus}</div>
      <div class="r-note">${x.note}</div>
    </div>
    ${x.study?'<div class="r-study">📐</div>':''}
  </div>`;
}).join('');

// Countdown
function daysTo(y,m,d){const tgt=new Date(y,m-1,d);const a=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.round((tgt-a)/86400000);}
const counts=[
  {n:daysTo(2026,8,15),l:'Move-In<br>Aug 15'},
  {n:daysTo(2026,8,16),l:'Orientation<br>Aug 16'},
  {n:daysTo(2026,8,28),l:'XC Report<br>Aug 28'},
];
document.getElementById('counts').innerHTML=counts.map(c=>
  `<div class="count"><div class="c-num">${c.n<0?'✓':c.n}</div><div class="c-label">${c.l}</div></div>`
).join('');
</script>
</body>
</html>
